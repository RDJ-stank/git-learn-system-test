<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>智能学习系统 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { width: 400px; padding: 20px; }
    </style>
</head>
<body>
    <div class="card shadow">
        <h3 class="text-center mb-4">📚 智能学习系统</h3>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-danger">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label>用户名</label>
                <input type="text" name="username" class="form-control" required placeholder="请输入用户名">
            </div>
            <div class="mb-3">
                <label>密码</label>
                <input type="password" name="password" class="form-control" required placeholder="请输入密码">
            </div>
            <div class="d-grid gap-2">
                <button type="submit" name="action" value="login" class="btn btn-primary">登录</button>
                <button type="submit" name="action" value="register" class="btn btn-outline-secondary">注册新账号</button>
            </div>
        </form>
    </div>
</body>
</html>
